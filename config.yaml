# Trading System Configuration
model: deepseek-chat
temperature: 0
max_turns: 30

# Scheduling (ET timezone)
schedule:
  market_scan: "09:45"
  eod_review: "16:15"
  monitor_interval_seconds: 30

# Risk defaults
risk:
  max_risk_per_trade_pct: 1.0
  max_portfolio_concentration_pct: 20.0
  daily_loss_limit_pct: 3.0
  max_open_positions: 10  # 5 -> 10, human-ratified 2026-06-11

# Income target — used by OPERATING_MANUAL.md §3 to size for "trading for a living".
# This is NOT a quota; it gates whether the agent runs in NORMAL or DEFENSIVE mode
# based on rolling 30-day expectancy. Set 0 to disable the gate.
income:
  target_per_day_usd: 0
  weekly_drawdown_halt_pct: 6.0    # OPERATING_MANUAL §4.4
  monthly_drawdown_halt_pct: 10.0  # OPERATING_MANUAL §4.4

# Broker
broker:
  mode: paper  # paper | live | simulation
  slippage_pct: 0.05
  fee_per_trade: 0.0

# Scanner universe — SUPERSEDED, do not scan from this list.
# The live scan universe is tools/universe_backtest.json (~400 names, built by
# scripts/load_universe.py from price/ADV gates) and is resolved in code by
# _universe_symbols(); see its docstring — "shared by live + backtest so both
# scan the same names". Call scan_swing_candidates() with NO symbols argument.
# Passing this hand-picked list instead cuts the universe 400 -> 67; that
# happened on 2026-07-06/07/10 (scan_funnel.universe_size = 67).
# Kept only as the legacy seed list.
scanner:
  universe:
    - AAPL
    - MSFT
    - NVDA
    - AMD
    - TSLA
    - META
    - GOOGL
    - AMZN
    - MU
    - AVGO
    - QCOM
    - CRM
    - INTC
    - ORCL
    - ADBE
    - NFLX
    - UBER
    - SHOP
    - PLTR
    - MRVL
    - LRCX
    - KLAC
    - AMAT
    - "ON"
    - SMCI
    - JPM
    - GS
    - MS
    - BAC
    - V
    - MA
    - AXP
    - C
    - UNH
    - JNJ
    - LLY
    - PFE
    - ABBV
    - MRK
    - BMY
    - XOM
    - CVX
    - OXY
    - SLB
    - COP
    - WMT
    - COST
    - NKE
    - SBUX
    - MCD
    - DIS
    - CAT
    - BA
    - GE
    - DE
    - RTX
    - LMT
    - COIN
    - MARA
    - RIOT
    - RIVN
    - ARM
    - SNOW
    - DDOG
    - NET
    - CRWD
  include_spy: true  # always include SPY for relative strength calculation

# Notifications
notifications:
  enabled: true
  on_trade: true
  on_exit: true
  daily_summary: true
  alerts: true

# Strategy registry — which strategies exist and are enabled for this account.
# The agent reads this list (it does not drive Python logic). The session's
# --market scope (set by the scheduler) narrows 'enabled' to that market.
strategies:
  enabled:
    - id: options/vol-edge
      market: options
      sop: v1.0.0
    - id: equity/swing
      market: equity
      sop: v1.6.0   # head of the delta chain — read v1.0.0 (base, both engines M+R)
                    # then apply v1.1.0..v1.6.0 in order.
                    # Was v1.3.0 since v1.3.0 shipped (2026-06-10); v1.4.0-v1.6.0
                    # landed 06-10/06-11 without it being updated. This file was
                    # never deployed to Hermes, so the agent had no source of truth
                    # and picked a version per trade — trade_plans records v1.0.0,
                    # v1.3.0 and v1.6.0 across 8 plans in two weeks. Bumped 2026-08-02.
                    # Nothing verifies this pin matches the newest file in sops/.
  disabled:
    - id: equity/intraday-momentum
      market: equity
      sop: v1.1.0   # gatekeeper hardened; still disabled pending validation
